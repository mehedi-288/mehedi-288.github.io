<style>
/* Layout: single-column scroll. Sticky pill nav, large left-aligned hero, three-up pillars, contact list. */
:root {
  --bg: #07070a;
  --surface: rgba(10, 14, 30, 0.7);
  --line: #22222c;
  --fg: #f2f2f5;
  --muted: #9a9aa8;
  --accent: #38bdf8;
  --accent-soft: rgba(56, 189, 248, 0.16);
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 0 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
.wrap { max-width: 960px; margin: 0 auto; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* Nav */
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-block: 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px);
}
.logo {
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent); color: var(--bg); font: 700 16px var(--display); text-decoration: none;
}
nav { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
nav a { padding: 6px 14px; border-radius: 999px; text-decoration: none; font-size: 14px; color: var(--muted); }
nav a:hover { color: var(--fg); background: var(--accent-soft); }
nav a.active, nav a.active:hover { color: #fff; background: transparent; }
.greet { margin: 0 0 8px; font: 500 clamp(18px, 3.5vw, 24px)/1.3 var(--display); color: var(--accent); }
.quote { margin: 0 0 28px; max-width: 40ch; color: var(--muted); font-style: italic; }

/* Hero */
.hero { position: relative; padding-block: 56px; display: grid; grid-template-columns: 1fr; gap: 40px; align-items: center; }
@media (min-width: 760px) { .hero { grid-template-columns: 1.35fr 1fr; } }
.hero-text { min-width: 0; }
.photo { margin: 0; justify-self: center; width: min(100%, 380px); aspect-ratio: 3 / 4; border-radius: 24px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; }
.hero::before {
  content: ""; position: absolute; z-index: -1; top: -40px; right: -10%; width: min(520px, 90vw); aspect-ratio: 1;
  background: radial-gradient(circle, var(--accent-soft), transparent 65%);
  pointer-events: none;
}
.eyebrow { margin: 0 0 20px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 0; font: 700 clamp(44px, 9vw, 104px)/0.98 var(--display); letter-spacing: -0.035em; text-wrap: balance; overflow-wrap: anywhere;
}
.dot { color: var(--accent); }
.role { margin: 28px 0 0; font: 500 clamp(20px, 4vw, 28px)/1.3 var(--display); }
.tagline { margin: 6px 0 0; color: var(--muted); font-size: 18px; }
.lede { max-width: 56ch; margin: 28px 0 0; color: var(--muted); }
.college { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.college:hover { text-decoration-thickness: 2px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 32px; padding: 12px 22px;
  border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 15px; text-decoration: none;
}
.btn:hover { background: var(--accent); }

/* Sections */
section { padding-block: 56px; border-top: 1px solid var(--line); scroll-margin-top: 72px; }
.label { margin: 0 0 12px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
h2 { margin: 0; font: 700 clamp(32px, 7vw, 56px)/1.05 var(--display); letter-spacing: -0.025em; text-wrap: balance; }
.sub { margin: 14px 0 0; max-width: 52ch; color: var(--muted); }

.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 40px; }
.pillar { min-width: 0; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.pillar h3 { margin: 0 0 8px; font: 700 22px var(--display); }
.pillar p { margin: 0; color: var(--muted); font-size: 15px; }
.pillar .tag { display: block; margin-bottom: 36px; font: 500 13px var(--display); color: var(--accent); }

/* Contact */
.links { list-style: none; margin: 36px 0 0; padding: 0; display: grid; gap: 12px; }
.links li {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 16px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
}
.links .name { font-weight: 600; }
.links .val { min-width: 0; overflow-wrap: anywhere; color: var(--muted); font-size: 15px; user-select: all; }
.links a.val { text-decoration: none; }
.links a.val:hover { color: var(--accent); }
.copy { font: 500 13px var(--body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.copy:hover { border-color: var(--accent); color: var(--accent); }

footer { padding-top: 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Floating ask/suggest button and panel */
.fab { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border: 0; border-radius: 999px; background: var(--accent); color: #04121c; font: 600 15px var(--body); cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
.fab:hover { filter: brightness(1.1); }
.fab svg { width: 20px; height: 20px; flex: none; }
.fb-panel { position: fixed; z-index: 30; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 400px; margin-left: auto; max-height: min(82vh, 640px); overflow-y: auto; padding: 20px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55); }
.fb-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.fb-head h3 { margin: 0; font: 700 20px var(--display); }
.fb-x { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--fg); font-size: 20px; line-height: 1; cursor: pointer; }
.fb-x:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; gap: 8px; margin-bottom: 14px; }
.chip { flex: 1; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font: 500 14px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.fb-panel label { display: block; margin: 12px 0 6px; font-size: 13px; color: var(--muted); }
.fb-panel textarea, .fb-panel input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); resize: vertical; }
.fb-panel textarea:focus, .fb-panel input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.send { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font: 600 15px var(--body); cursor: pointer; }
.send:hover:not(:disabled) { background: var(--accent); }
.send:disabled { opacity: 0.6; cursor: default; }
.status { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.status.err { color: #f59e8b; }
.fb-fallback { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); font-size: 14px; color: var(--muted); }
.fb-fallback p { margin: 0 0 10px; }
.fb-fallback .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 8px; color: var(--fg); }
.fb-fallback .row span { min-width: 0; overflow-wrap: anywhere; user-select: all; }
.fb-fallback a { color: var(--accent); }
.inbox { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.inbox h4 { margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 700 16px var(--display); }
.inbox ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.inbox li { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.inbox .meta { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
.inbox .text { margin: 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.inbox .empty { margin: 0; font-size: 14px; color: var(--muted); }

/* One entrance moment; resting state is fully visible */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.hero > * { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) backwards; }
.hero > *:nth-child(2) { animation-delay: .08s; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .hero > * { animation: none; } }
.bio { max-width: 62ch; margin: 24px 0 0; color: var(--fg); }
.label.now { margin-top: 48px; }
.pillars.tight { margin-top: 16px; }
.send.alt { margin-top: 10px; background: transparent; color: var(--fg); border: 1px solid var(--line); }
.send.alt:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
